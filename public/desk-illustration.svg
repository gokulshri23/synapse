<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Background Desk -->
  <rect x="0" y="250" width="500" height="150" fill="#E8E3D8" />
  
  <!-- Laptop -->
  <rect x="150" y="150" width="200" height="120" rx="10" fill="#FCFAF6" stroke="#D5CFC3" stroke-width="4"/>
  <rect x="160" y="160" width="180" height="100" rx="5" fill="#1C1917"/>
  <rect x="130" y="270" width="240" height="15" rx="5" fill="#D5CFC3"/>
  
  <!-- Coffee Cup -->
  <rect x="380" y="220" width="40" height="50" rx="5" fill="#FCFAF6" stroke="#D5CFC3" stroke-width="3"/>
  <path d="M420 230 C 435 230, 435 260, 420 260" fill="none" stroke="#D5CFC3" stroke-width="4"/>
  
  <!-- Notebook -->
  <rect x="60" y="240" width="70" height="90" rx="4" fill="#B45309" transform="rotate(-15 60 240)"/>
  <rect x="65" y="240" width="60" height="85" fill="#FCFAF6" transform="rotate(-15 60 240)"/>
  
  <!-- Pencils -->
  <line x1="100" y1="210" x2="80" y2="245" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="215" x2="95" y2="250" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Warm glow/Accents -->
  <circle cx="250" cy="100" r="60" fill="#D97706" opacity="0.1"/>
  <circle cx="250" cy="100" r="40" fill="#D97706" opacity="0.2"/>
</svg>
